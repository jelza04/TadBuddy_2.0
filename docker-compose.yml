services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama   # downloaded LLM weights live here, not in the image
    ports:
      - "11434:11434"   # lets you curl/check it from your own machine if needed

  rag-lessons:
    build: .
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434   # "ollama" = the service name above, Docker resolves it
    depends_on:
      - ollama
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface   # keeps the downloaded model out of the image layer
    command: python lesson1_embeddings.py

volumes:
  hf_cache:
  ollama_models:
